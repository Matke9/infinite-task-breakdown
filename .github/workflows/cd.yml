name: CD

# Path B deploy (DECISIONS 009): checks gate the deploy ("CI gates CD"), then the
# frontend ships to Cloudflare Pages and the backend deploy is triggered on Render
# via its deploy hook (Render auto-deploy is turned OFF). Runs only on push to main.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VITE_API_URL            - the live backend URL, e.g. https://tasktree-api.onrender.com
#   CLOUDFLARE_API_TOKEN    - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   - your Cloudflare account id
#   RENDER_DEPLOY_HOOK_URL  - the backend service's Deploy Hook URL from Render
# Also: set the Cloudflare Pages project name below (--project-name) to the one you create.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci

      # --- Gates: a failure here aborts the job, so nothing below deploys ---
      - name: Type-check backend
        run: cd backend && npm run typecheck

      - name: Lint backend
        run: cd backend && npm run lint

      - name: Type-check frontend
        run: cd frontend && npm run typecheck

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Test frontend
        run: cd frontend && npm run test

      # --- Build the frontend against the live API URL ---
      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # --- Ship the static frontend to Cloudflare Pages ---
      - name: Deploy to Cloudflare Pages
        run: cd frontend && npx --yes wrangler@latest pages deploy dist --project-name=tasktree --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # --- Trigger the backend deploy on Render (auto-deploy is OFF) ---
      - name: Trigger Render deploy
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
